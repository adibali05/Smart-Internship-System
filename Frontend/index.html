<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Internship Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        .gradient-text {
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-8 font-sans antialiased fade-in">

    <div class="mb-10 text-center">
        <h1 class="text-5xl font-extrabold mb-2 gradient-text">🎓 Smart Internship AI</h1>
        <p class="text-gray-400 text-lg">Real-time NLP Tracking & Evaluation Dashboard</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="glass-panel p-6 lg:col-span-1 shadow-lg fade-in" style="animation-delay: 0.1s;">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">📝 Developer Portal</h2>
            <p class="text-gray-400 text-sm mb-6">Submit your weekly work log for AI evaluation.</p>
            
            <input type="text" id="student_id" placeholder="Student ID (e.g. STU001)" 
                class="w-full bg-gray-800 text-white rounded-lg p-3 mb-4 border border-gray-700 focus:outline-none focus:border-blue-500 transition">
            
            <textarea id="log_text" placeholder="Describe your technical work..." rows="5"
                class="w-full bg-gray-800 text-white rounded-lg p-3 mb-6 border border-gray-700 focus:outline-none focus:border-blue-500 transition"></textarea>
            
            <button onclick="submitLog()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 font-bold py-3 px-4 rounded-lg btn-glow flex justify-center items-center gap-2">
                <span id="btn-text">🚀 Evaluate with AI</span>
                <div id="spinner" class="loader"></div>
            </button>
            <p id="status-message" class="mt-4 text-center text-sm hidden font-bold"></p>
        </div>

        <div class="lg:col-span-2 flex flex-col gap-8 fade-in" style="animation-delay: 0.2s;">
            
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-panel p-6 shadow-lg text-center">
                    <h3 class="text-gray-400 font-semibold">Total Submissions</h3>
                    <p id="total-logs" class="text-4xl font-bold text-white mt-2">0</p>
                </div>
                <div class="glass-panel p-6 shadow-lg text-center">
                    <h3 class="text-gray-400 font-semibold">Avg Technical Score</h3>
                    <p id="avg-score" class="text-4xl font-bold text-green-400 mt-2">0%</p>
                </div>
            </div>

            <div class="glass-panel p-6 shadow-lg">
                <h3 class="text-xl font-bold mb-4 text-purple-400">📈 AI Performance Analytics</h3>
                <canvas id="scoreChart" height="100"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let scoreChartInstance = null;

        document.addEventListener("DOMContentLoaded", fetchDashboardData);

        async function submitLog() {
            const stuId = document.getElementById('student_id').value;
            const text = document.getElementById('log_text').value;
            const statusMsg = document.getElementById('status-message');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');

            if (!stuId || !text) {
                showStatus("⚠️ Please fill all fields", "text-yellow-400");
                return;
            }

            spinner.style.display = "block";
            btnText.innerText = "Analyzing...";
            
            try {
                const response = await fetch(`${API_URL}/submit-log/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: stuId, log_text: text })
                });

                if (response.ok) {
                    showStatus("✅ Success! Log evaluated.", "text-green-400");
                    document.getElementById('log_text').value = '';
                    fetchDashboardData();
                } else {
                    showStatus("❌ Failed to evaluate.", "text-red-400");
                }
            } catch (err) {
                showStatus("⚠️ Backend server is offline.", "text-red-400");
            }

            spinner.style.display = "none";
            btnText.innerText = "🚀 Evaluate with AI";
        }

        async function fetchDashboardData() {
            try {
                const response = await fetch(`${API_URL}/dashboard-data/`);
                const data = await response.json();
                const logs = data.logs || [];

                document.getElementById('total-logs').innerText = logs.length;
                
                if (logs.length > 0) {
                    const avgTech = logs.reduce((sum, log) => sum + log.technical_score, 0) / logs.length;
                    document.getElementById('avg-score').innerText = avgTech.toFixed(1) + "%";
                    
                    updateChart(logs);
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function updateChart(logs) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            const labels = logs.map(log => log.student_id);
            const techScores = logs.map(log => log.technical_score);
            const softScores = logs.map(log => log.soft_skills_score);

            if (scoreChartInstance) scoreChartInstance.destroy();

            scoreChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Technical Score',
                            data: techScores,
                            backgroundColor: 'rgba(59, 130, 246, 0.7)',
                            borderRadius: 6
                        },
                        {
                            label: 'Soft Skills Score',
                            data: softScores,
                            backgroundColor: 'rgba(236, 72, 153, 0.7)',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { color: '#9ca3af' } },
                        x: { ticks: { color: '#9ca3af' } }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }

        function showStatus(msg, colorClass) {
            const el = document.getElementById('status-message');
            el.innerText = msg;
            el.className = `mt-4 text-center text-sm font-bold block ${colorClass}`;
            setTimeout(() => el.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
